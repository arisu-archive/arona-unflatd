name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master

  linux-amd64:
    name: Build Linux x86_64
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          architecture: x64
          cache-dependency-path: go.sum

      - name: Build archive and checksum
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: linux
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          package="arona-unflatd_${VERSION}_linux_amd64"
          mkdir -p "dist/${package}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${package}/arona-unflatd" .
          actual_version=$("dist/${package}/arona-unflatd" --version)
          expected_version="arona-unflatd version ${VERSION}"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "expected '${expected_version}', got '${actual_version}'" >&2
            exit 1
          fi
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          package="arona-unflatd_${VERSION}_linux_amd64"
          gh release upload "${TAG_NAME}" \
            "dist/${package}.tar.gz" \
            "dist/${package}.tar.gz.sha256" \
            --clobber

  windows-amd64:
    name: Build Windows x86_64
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          architecture: x64
          cache-dependency-path: go.sum

      - name: Build archive and checksum
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: windows
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $package = "arona-unflatd_{0}_windows_amd64" -f $env:VERSION
          $packagePath = Join-Path dist $package
          $binaryPath = Join-Path $packagePath "arona-unflatd.exe"
          $archivePath = Join-Path dist "$package.zip"
          $checksumPath = "$archivePath.sha256"

          New-Item -ItemType Directory -Force -Path $packagePath | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o $binaryPath .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $actualVersion = & $binaryPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedVersion = "arona-unflatd version $env:VERSION"
          if ($actualVersion -ne $expectedVersion) {
            throw "expected '$expectedVersion', got '$actualVersion'"
          }

          Copy-Item README.md, LICENSE -Destination $packagePath
          Compress-Archive -Path $packagePath -DestinationPath $archivePath

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "${hash}  ${package}.zip" | Set-Content -LiteralPath $checksumPath -NoNewline

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $package = "arona-unflatd_{0}_windows_amd64" -f $env:VERSION
          gh release upload $env:TAG_NAME "dist/$package.zip" "dist/$package.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
